project_id = "adeio"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://adeio.vercel.app"
additional_redirect_urls = [
  "https://adeio.vercel.app/",
  "https://adeio.vercel.app/auth/callback",
  "https://adeio.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
]
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
secure_email_change = true
enable_confirmations = true

[storage]
enabled = true
